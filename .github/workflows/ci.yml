name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Postgres 17 client (pg_dump/psql must match the server major version)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
          echo "PSQL=/usr/lib/postgresql/17/bin/psql" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hq-engine .
      - name: Smoke test the image (cards valid, pg_dump 17, Agent SDK loads)
        run: |
          docker run --rm hq-engine pnpm -s cards:validate engine/test/fixtures/hidden
          docker run --rm hq-engine sh -c '$PG_DUMP --version | grep -q " 17\."'
          docker run --rm -w /app/engine hq-engine node -e "import('@anthropic-ai/claude-agent-sdk').then(m => { if (typeof m.query !== 'function') process.exit(1); console.log('agent sdk ok') })"
